services:
  postgres:
    image: postgres:15
    container_name: trazaap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trazaap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - trazaap_pg_data:/var/lib/postgresql/data
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["documents"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Define MINIO_ACCESS_KEY in a local .env file}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Define MINIO_SECRET_KEY in a local .env file}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - trazaap_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  trazaap_pg_data:
  trazaap_minio_data:
