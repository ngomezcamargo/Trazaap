version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: trazaap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trazaap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - trazaap_pg_data:/var/lib/postgresql/data
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["documents"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-change_this_minio_access_key}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_this_minio_secret_key}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - trazaap_minio_data:/data

volumes:
  trazaap_pg_data:
  trazaap_minio_data:
