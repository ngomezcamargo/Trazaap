version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: trazaap_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trazaap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - trazaap_pg_data:/var/lib/postgresql/data

volumes:
  trazaap_pg_data:
